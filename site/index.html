<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Capitol Quest — Hawaiʻi</title>
  <link rel="stylesheet" href="css/style.css?v=20260831132204">
</head>
<body>
  <div id="game"></div>

  <div id="hud">
    <div id="title-chip">
      <span class="star">★</span> CAPITOL QUEST
      <button id="island-chip" type="button" title="Change island">· Oʻahu ▾</button>
      <!-- Sound on/off. It rides the title chip rather than the toolbar
           on purpose: the four toolbar buttons are DOORS into panels and
           a fifth button that is a preference would misread as a fifth
           panel. Small, quiet, and always reachable. -->
      <button id="sfx-chip" type="button" aria-pressed="true"
        title="Sound on/off"></button>
    </div>
    <div id="island-menu" class="hidden"></div>
    <div id="hint">Drag to pan · Scroll or pinch to zoom · Tap the Capitol</div>
    <div id="chips">
      <button id="flows-chip" class="hidden" type="button"></button>
      <button id="get-chip" class="hidden" type="button"></button>
      <button id="hi-chip" class="hidden" type="button"></button>
    </div>

    <div id="toolbar">
      <button id="tb-budget" type="button" title="State budget — FY2027: where the money comes from and where it goes">
        <svg viewBox="0 0 18 18" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="1"  y="10" width="4" height="7" fill="#f2c14e"/>
          <rect x="7"  y="5"  width="4" height="12" fill="#f2c14e"/>
          <rect x="13" y="1"  width="4" height="16" fill="#ffe9a8"/>
        </svg>
        <span>Budget</span>
      </button>
      <button id="tb-session" type="button" title="Your campaign through the session — the week's intel, events, dialogues and your one action">
        <svg viewBox="0 0 18 18" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="2"  y="3"  width="14" height="13" fill="#f6f1dc"/>
          <rect x="2"  y="3"  width="14" height="3"  fill="#c0392b"/>
          <rect x="4"  y="1"  width="2"  height="3"  fill="#7b6a3a"/>
          <rect x="12" y="1"  width="2"  height="3"  fill="#7b6a3a"/>
          <rect x="4"  y="8"  width="3"  height="2"  fill="#7b6a3a"/>
          <rect x="9"  y="8"  width="3"  height="2"  fill="#b8a468"/>
          <rect x="4"  y="12" width="3"  height="2"  fill="#b8a468"/>
          <rect x="9"  y="12" width="5"  height="2"  fill="#f2c14e"/>
        </svg>
        <span>Session <b id="tb-week-badge" class="wk-badge">W1</b></span>
      </button>
      <button id="tb-instincts" type="button" title="Your instincts — the six skills every check rolls against">
        <svg viewBox="0 0 18 18" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="2"  y="2"  width="14" height="14" fill="#f6f1dc"/>
          <rect x="2"  y="14" width="14" height="2"  fill="#b8a468"/>
          <rect x="14" y="2"  width="2"  height="14" fill="#b8a468"/>
          <rect x="4"  y="4"  width="3"  height="3"  fill="#c0392b"/>
          <rect x="8"  y="8"  width="3"  height="3"  fill="#7b6a3a"/>
          <rect x="11" y="4"  width="3"  height="3"  fill="#7b6a3a"/>
          <rect x="4"  y="11" width="3"  height="3"  fill="#7b6a3a"/>
        </svg>
        <span>Instincts</span>
      </button>
      <button id="tb-policy" type="button" title="Pass policies — invest in priorities, raise the revenue to pay for them">
        <svg viewBox="0 0 18 18" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="3"  y="1"  width="12" height="16" fill="#f6f1dc"/>
          <rect x="5"  y="4"  width="8"  height="1"  fill="#7b6a3a"/>
          <rect x="5"  y="7"  width="8"  height="1"  fill="#7b6a3a"/>
          <rect x="5"  y="10" width="5"  height="1"  fill="#7b6a3a"/>
          <rect x="10" y="12" width="4"  height="4"  fill="#f2c14e"/>
          <rect x="11" y="13" width="2"  height="2"  fill="#b07d1e"/>
        </svg>
        <span>Policies</span>
      </button>
      <button id="tb-map" type="button" title="The island map — zoom out to Oʻahu and the neighbor islands">
        <svg viewBox="0 0 18 18" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="1"  y="9"  width="6"  height="2" fill="#5a8f5a"/>
          <rect x="2"  y="7"  width="4"  height="2" fill="#5a8f5a"/>
          <rect x="9"  y="6"  width="7"  height="3" fill="#7bab6e"/>
          <rect x="4"  y="13" width="9"  height="2" fill="#7bab6e"/>
          <rect x="0"  y="0"  width="18" height="18" fill="none" stroke="#2a5c86" stroke-width="0"/>
          <rect x="13" y="9"  width="1"  height="1" fill="#f2c14e"/>
        </svg>
        <span>Map</span>
      </button>
    </div>
    <button id="fund-chip" type="button"></button>
    <div id="hud-turn">
      <!-- Your standing, ambient on the map: the two campaign meters that
           have no life outside the session overlay. Money deliberately is
           NOT here — #fund-chip already carries it (bottom right), and a
           second money figure on the same screen only invites the reader
           to reconcile the two. -->
      <div id="hud-standing"></div>
      <div id="hud-timeline" class="htl" title="Session timeline"></div>
      <button id="turn-chip" type="button" title="Advance the session by one week">
        <span class="tc-label">Week 1</span>
        <span class="tc-act">End Turn ▸</span>
      </button>
    </div>
  </div>

  <div id="money-overlay" class="ovl hidden" role="dialog" aria-modal="true">
    <div class="ovl-panel">
      <div class="ovl-title" id="money-title">Money In · FY2027</div>
      <button class="ovl-close" id="money-close" type="button" aria-label="Close">✕</button>
      <div class="ovl-tabs">
        <button id="mt-revenue" type="button">↓ Money in</button>
        <button id="mt-budget" type="button">↑ Money out</button>
      </div>

      <div class="mview" id="mv-revenue">
        <div id="rv-sources">
          <div class="ovl-hero" id="sources-hero"></div>
          <div class="ovl-legend">
            <span><i class="sw sw-gf"></i>General funds</span>
            <span><i class="sw sw-fed"></i>Federal funds</span>
            <span><i class="sw sw-oth"></i>All other funds</span>
          </div>
          <div id="sources-map" class="flow-map">
            <svg id="sources-svg" class="flow-svg" viewBox="0 0 660 420" aria-label="The three kinds of money paying for the budget"></svg>
            <div id="sources-detail" class="flow-detail"></div>
          </div>
          <div class="ovl-foot" id="sources-foot"></div>
        </div>

        <div id="rv-taxes" class="hidden">
          <div class="ovl-hero" id="revenue-hero"></div>
          <div class="ovl-legend">
            <button id="rev-back" class="view-toggle back" type="button">← Funding mix</button>
            <span><i class="sw sw-gf"></i>Income tax — gold on the map</span>
            <span><i class="sw sw-get"></i>GET — teal on the map</span>
            <span><i class="sw sw-oth"></i>All other taxes</span>
            <button id="revenue-view" class="view-toggle" type="button">▤ List</button>
          </div>
          <div id="revenue-map" class="flow-map">
            <svg id="revenue-svg" class="flow-svg" viewBox="0 0 660 420" aria-label="Taxes flowing into the Capitol"></svg>
            <div id="revenue-detail" class="flow-detail"></div>
          </div>
          <div class="ovl-rows hidden" id="revenue-rows"></div>
          <div class="ovl-foot" id="revenue-foot"></div>
        </div>
      </div>

      <div class="mview hidden" id="mv-budget">
        <div class="ovl-hero" id="budget-hero"></div>
        <div class="ovl-legend" id="budget-legend">
          <span><i class="sw sw-gf"></i>General funds</span>
          <span><i class="sw sw-fed"></i>Federal funds</span>
          <span><i class="sw sw-oth"></i>All other funds</span>
          <button id="budget-view" class="view-toggle" type="button">▤ List</button>
        </div>
        <div id="budget-map" class="flow-map">
          <svg id="budget-svg" class="flow-svg" viewBox="0 0 660 420" aria-label="Money flowing from the Capitol to each department"></svg>
          <div id="budget-detail" class="flow-detail"></div>
        </div>
        <div class="ovl-rows hidden" id="budget-rows"></div>
        <div class="ovl-foot" id="budget-foot"></div>
      </div>
    </div>
  </div>

  <div id="policy-overlay" class="ovl hidden" role="dialog" aria-modal="true">
    <div class="ovl-panel">
      <div class="ovl-title" id="policy-title">Policies · FY2027</div>
      <button class="ovl-close" id="policy-close" type="button" aria-label="Close">✕</button>
      <div class="ovl-tabs">
        <button id="pt-priorities" type="button">🎯 Priorities</button>
        <button id="pt-revenue" type="button">💵 Raise revenue</button>
      </div>

      <div class="mview" id="pv-priorities">
        <div class="ovl-hero" id="prio-hero"></div>
        <div class="ovl-rows" id="prio-rows"></div>
        <div class="ovl-foot" id="prio-foot"></div>
      </div>

      <div class="mview hidden" id="pv-revenue">
        <div class="ovl-hero" id="rpol-hero"></div>
        <div class="ovl-rows" id="rpol-rows"></div>
        <div class="ovl-foot" id="rpol-foot"></div>
      </div>
    </div>
  </div>

  <div id="session-overlay" class="ovl hidden" role="dialog" aria-modal="true">
    <div class="ovl-panel">
      <!-- ONE masthead, riding the panel's top-left corner: the week
           number, the week's name and its real dates. It replaced both
           the old "The Campaign · Week N" chip and the separate
           #sess-week row below it, which said overlapping things in two
           places (2026-08-15, user's call). -->
      <div class="ovl-title mast" id="session-title"></div>
      <button class="ovl-close" id="session-close" type="button" aria-label="Close">✕</button>
      <div id="sess-head">
        <!-- The compact progress bar rides the panel's top band BESIDE
             the week plate (2026-08-19, user's call: "move the timeline
             to the top of the event card, to the right of the week
             indicator"). It is absolutely positioned against .ovl-panel
             rather than laid out in a row with the plate, because the
             plate's width changes with the week's title (303px on
             "First Hearings", 363px on "Money Committee Week") and a
             flexed strip would re-space its milestones every week.
             It lives INSIDE #sess-head so `.creating` hides it for free
             with the rest of the session chrome. Tapping it opens the
             full milestone strip below. -->
        <button id="sess-progress" class="htl" type="button"
          aria-expanded="false" title="Session timeline"></button>
        <div id="sess-timeline" class="sess-timeline"></div>
        <div id="sess-metrics"></div>
      </div>
      <div class="ovl-rows" id="sess-body"></div>
      <div class="ovl-foot" id="sess-foot"></div>
    </div>
  </div>

  <div id="dialog" class="hidden" role="dialog" aria-live="polite">
    <div id="dialog-name"></div>
    <div id="dialog-text"></div>
    <div id="dialog-next">▼</div>
  </div>

  <script>
    // Dev-only: headless/hidden webviews never fire requestAnimationFrame,
    // which stalls the game loop. ?raf=mc swaps in a MessageChannel-driven
    // rAF so automated previews can render. Never active for real players.
    if (location.search.includes("raf=mc")) {
      (function () {
        const ch = new MessageChannel();
        let cbs = [];
        ch.port1.onmessage = () => {
          const list = cbs; cbs = [];
          const t = performance.now();
          list.forEach((cb) => { try { cb(t); } catch (e) { console.error(e); } });
        };
        window.requestAnimationFrame = (cb) => {
          cbs.push(cb);
          if (cbs.length === 1) setTimeout(() => ch.port2.postMessage(0), 8);
          return cbs.length;
        };
        window.cancelAnimationFrame = () => {};
      })();
    }
  </script>
  <script src="vendor/phaser.min.js"></script>
  <!-- Seedable RNG for gameplay rolls (window.ROT.RNG) — see the seed
       block below and CLAUDE.md. Not yet used for anything else
       (rot.js's map/FOV/pathfinding modules ride along unused). -->
  <script src="vendor/rot.min.js"></script>
  <!-- Phaser 3 isometric plugin (window.PhaserIso) — vendored ahead of
       the player-sprite feature; no scene registers it yet. -->
  <script src="vendor/phaser3-plugin-isometric.js"></script>
  <script>
    // ?seed=<n> freezes the gameplay RNG (2d6 checks + bill-gauntlet
    // hazard draws) for a reproducible run — same dev-flag pattern as
    // ?raf=mc above. Real play is unaffected: ROT.RNG seeds itself from
    // the clock, same as Math.random, when this is absent.
    (function () {
      const m = location.search.match(/[?&]seed=(\d+)/);
      if (m) ROT.RNG.setSeed(Number(m[1]));
    })();
  </script>
  <!-- UI sound: synthesised at runtime, no audio files. Loaded
       BEFORE main.js, which calls window.SFX from its handlers. -->
  <script src="js/sfx.js?v=20260819125954"></script>
  <script src="js/main.js?v=20260922095444"></script>
</body>
</html>
